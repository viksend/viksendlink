<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="icon" type="image/png" href="favicon.png"> 
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="particles-js"></div>

    <div class="main-wrapper">
        <div class="container" data-tilt data-tilt-max="6" data-tilt-speed="1000" data-tilt-perspective="1000">
            
            <div class="profile-header">
                <img src="avatar.png" alt="Avatar" class="avatar">
                
                <div class="nickname-container">
                    <h1>viksend</h1>
                    <img src="badge.gif" alt="Badge" class="chat-badge">
                </div>
                
                <p class="bio">дароу • все соцсети xd</p>
            </div>

            <div class="links-list">
                
                <a href="https://t.me/wipixviksend" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-telegram-plane"></i>
                        <span>Telegram</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://tiktok.com/@viksendidk" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-tiktok"></i>
                        <span>TikTok</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://www.twitch.tv/viksend" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-twitch"></i>
                        <span>Twitch</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://youtube.com/@viksend" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-youtube"></i>
                        <span>YouTube</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://donatex.gg/donate/viksend" target="_blank" class="link-btn donate">
                    <span class="btn-content">
                        <i class="fa-solid fa-wallet"></i>
                        <span>DonateX</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>

            </div>

            <div class="footer">
                <p>© 2026 • silence</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { 
                    "value": 65, 
                    "density": { "enable": true, "value_area": 800 } 
                },
                "color": { "value": "#a855f7" }, 
                "shape": { "type": "circle" },
                "opacity": { 
                    "value": 0.4, /* Сделали частицы ярче, чтобы они круто размывались под стеклом */
                    "random": true, 
                    "anim": { "enable": true, "speed": 0.6, "opacity_min": 0.15, "sync": false } 
                },
                "size": { 
                    "value": 4, 
                    "random": true, 
                    "anim": { "enable": true, "speed": 1.2, "size_min": 1, "sync": false } 
                },
                "line_linked": { 
                    "enable": true, 
                    "distance": 130, 
                    "color": "#a855f7", 
                    "opacity": 0.15, 
                    "width": 1 
                },
                "move": { 
                    "enable": true, 
                    "speed": 0.9, 
                    "direction": "none", 
                    "random": true, 
                    "straight": false, 
                    "out_mode": "out", 
                    "bounce": false 
                }
            },
            "interactivity": {
                "detect_on": "window", 
                "events": { 
                    "onhover": { "enable": true, "mode": "repulse" }, 
                    "onclick": { "enable": true, "mode": "push" }, 
                    "resize": true 
                },
                "modes": { 
                    "repulse": { "distance": 120, "duration": 0.4 },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });
    </script>

</body>
</html>
