<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="particles-js"></div>

    <div class="main-wrapper">
        <div class="container">
            
            <div class="profile-header">
                <img src="avatar.jpg" alt="Avatar" class="avatar">
                <h1>viksend</h1>
                <p class="bio">дароу • все соцсети xd</p>
            </div>

            <div class="links-list">
                
                <a href="https://t.me/твой_телеграм" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-telegram-plane"></i>
                        <span>Telegram</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://tiktok.com/@твой_тикток" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-tiktok"></i>
                        <span>TikTok</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://www.twitch.tv/viksend" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-twitch"></i>
                        <span>Twitch</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://youtube.com/@viksend" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-youtube"></i>
                        <span>YouTube</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://donatex.gg/donate/viksend" target="_blank" class="link-btn donate">
                    <span class="btn-content">
                        <i class="fa-solid fa-wallet"></i>
                        <span>DonateX</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>

            </div>

            <div class="footer">
                <p>© 2026 • silence</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { 
                    "value": 55, /* Немного увеличили количество для лучшего эффекта разлета */
                    "density": { "enable": true, "value_area": 900 } 
                },
                "color": { "value": "#a855f7" }, /* Модный фиолетовый неон (Purple) */
                "shape": { "type": "circle" },
                "opacity": { 
                    "value": 0.3, /* Сделали чуть ярче, чтобы фиолетовое свечение читалось */
                    "random": true, 
                    "anim": { "enable": true, "speed": 0.5, "opacity_min": 0.1, "sync": false } 
                },
                "size": { 
                    "value": 3.5, 
                    "random": true, 
                    "anim": { "enable": true, "speed": 1, "size_min": 1, "sync": false } 
                },
                "line_linked": { 
                    "enable": true, 
                    "distance": 150, 
                    "color": "#a855f7", /* Фиолетовая паутинка связей */
                    "opacity": 0.12, 
                    "width": 1 
                },
                "move": { 
                    "enable": true, 
                    "speed": 0.8, /* Спокойное базовое парение */
                    "direction": "none", 
                    "random": true, 
                    "straight": false, 
                    "out_mode": "out", 
                    "bounce": false 
                }
            },
            "interactivity": {
                "detect_on": "window", /* "window" вместо canvas, чтобы разлет срабатывал по всей площади экрана */
                "events": { 
                    "onhover": { 
                        "enable": true, 
                        "mode": "repulse" /* Эффект разлета частиц при наведении мыши! */
                    }, 
                    "onclick": { 
                        "enable": true, 
                        "mode": "push" /* Клик взрывает и добавляет новые частицы */
                    }, 
                    "resize": true 
                },
                "modes": { 
                    "repulse": { 
                        "distance": 100, /* Радиус, на который частицы будут убегать от курсора */
                        "duration": 0.4 
                    },
                    "push": { 
                        "particles_nb": 3 /* Сколько частиц добавляется при клике */
                    }
                }
            },
            "retina_detect": true
        });
    </script>

</body>
</html>
