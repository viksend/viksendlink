<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="icon" type="image/png" href="favicon.png"> 
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Слой частиц на заднем фоне -->
    <div id="particles-js"></div>

    <!-- Динамический островок (Apple Dynamic Island) -->
    <div class="dynamic-island" id="island" onclick="toggleIsland()">
        <div class="island-compact">
            <i class="fa-solid fa-briefcase"></i>
            <span>сотрудничество</span>
            <i class="fa-solid fa-chevron-down island-arrow"></i>
        </div>
        <div class="island-content">
            <div class="contact-item">
                <i class="fab fa-telegram-plane"></i>
                <span>telegram:</span>
                <a href="https://telegram.me/viksend" target="_blank" onclick="event.stopPropagation();">@viksend</a>
            </div>
            <div class="contact-item">
                <i class="fa-solid fa-envelope"></i>
                <span>почта:</span>
                <a href="mailto:bussywepex@gmail.com" onclick="event.stopPropagation();">bussywepex@gmail.com</a>
            </div>
        </div>
    </div>

    <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА (Жесткое выравнивание) -->
    <div class="content-wrapper">
        
        <!-- Основная карточка с соцсетями -->
        <div class="container">
            
            <div class="profile-header">
                <img src="avatar.png" alt="Avatar" class="avatar">
                
                <div class="nickname-container">
                    <h1>viksend</h1>
                    <img src="badge.gif" alt="Badge" class="chat-badge">
                </div>
                
                <p class="bio">дароу • все соцсети xd</p>
            </div>

            <div class="links-list">
                
                <a href="https://telegram.me/wipixviksend" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-telegram-plane"></i>
                        <span>Telegram</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://tiktok.com/@viksendidk" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-tiktok"></i>
                        <span>TikTok</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://www.twitch.tv/viksend" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-twitch"></i>
                        <span>Twitch</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://youtube.com/@viksend" target="_blank" class="link-btn">
                    <span class="btn-content">
                        <i class="fab fa-youtube"></i>
                        <span>YouTube</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>
                
                <a href="https://donatex.gg/donate/viksend" target="_blank" class="link-btn donate">
                    <span class="btn-content">
                        <i class="fa-solid fa-wallet"></i>
                        <span>DonateX</span>
                    </span>
                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>

            </div>

            <div class="footer">
                <p>© 2026 • silence</p>
            </div>
        </div>

        <!-- ТАБЛИЦА СБОРА DONATEX -->
        <div class="donate-container">
            <div class="donate-header">
                <i class="fa-solid fa-trophy goal-icon"></i>
                <h2>Текущие сборы</h2>
            </div>
            
            <div class="goals-wrapper" id="goals-loading">
                <div class="glass-loader">Загрузка актуальных данных...</div>
            </div>

            <div class="goals-list" id="goals-container" style="display: none;">
                <table class="liquid-table">
                    <thead>
                        <tr>
                            <th>Цель сбора</th>
                            <th>Прогресс</th>
                            <th>Собрано</th>
                        </tr>
                    </thead>
                    <tbody id="goals-tbody">
                        <!-- Строки таблицы генерируются из JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Подключение внешних библиотек скриптов -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <!-- Скрипт фоновых частиц -->
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 65, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#a855f7" }, 
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4, "random": true, "anim": { "enable": true, "speed": 0.6, "opacity_min": 0.15, "sync": false } },
                "size": { "value": 4, "random": true, "anim": { "enable": true, "speed": 1.2, "size_min": 1, "sync": false } },
                "line_linked": { "enable": true, "distance": 130, "color": "#a855f7", "opacity": 0.15, "width": 1 },
                "move": { "enable": true, "speed": 0.9, "direction": "none", "random": true, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "window", 
                "events": { 
                    "onhover": { "enable": true, "mode": "repulse" }, 
                    "onclick": { "enable": true, "mode": "push" }, 
                    "resize": true 
                },
                "modes": { 
                    "repulse": { "distance": 120, "duration": 0.4 },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });
    </script>

<!-- Скрипт интерфейса и логики сборов -->
<script>
    function toggleIsland() {
        const island = document.getElementById('island');
        island.classList.toggle('active');
    }

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (!isMobile) {
        VanillaTilt.init(document.querySelector(".container"), {
            max: 6,
            speed: 1000,
            perspective: 1000
        });
    }

    // =========================================================================
    // ⚙️ НАСТРОЙКА СБОРОВ (МЕНЯЙ ТОЛЬКО ЭТОТ МАССИВ):
    // =========================================================================
    const MY_GOALS = [
        { 
            title: "на матеренку и процык",  // Название сбора
            current: 1500,              // Сколько сейчас собрано (в ₽)
            target: 20000               // Сколько всего нужно собрать (в ₽)
        }
        // Чтобы добавить 3-й сбор, просто раскомментируй (убери //) строки ниже:
        // ,{ 
        //     title: "на видеокарту", 
        //     current: 15000, 
        //     target: 60000 
        // }
    ];
    // =========================================================================

    function renderGoals() {
        const tbody = document.getElementById('goals-tbody');
        const loading = document.getElementById('goals-loading');
        const container = document.getElementById('goals-container');

        if (!MY_GOALS || MY_GOALS.length === 0) {
            loading.innerText = 'Сборов пока нет';
            return;
        }

        loading.style.display = 'none';
        container.style.display = 'block';
        tbody.innerHTML = '';

        MY_GOALS.forEach(goal => {
            // Вычисляем процент от 0% до 100%
            const percent = goal.target > 0 
                ? Math.min(Math.round((goal.current / goal.target) * 100), 100) 
                : 0;
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="goal-title">${goal.title}</td>
                <td>
                    <div class="liquid-progress-bar">
                        <div class="liquid-progress-fill" style="width: ${percent}%"></div>
                        <span class="progress-percent">${percent}%</span>
                    </div>
                </td>
                <td class="goal-amount">${goal.current.toLocaleString('ru-RU')} / <span class="goal-target">${goal.target.toLocaleString('ru-RU')} ₽</span></td>
            `;
            tbody.appendChild(row);
        });
    }

    document.addEventListener('DOMContentLoaded', renderGoals);
</script>
</body>
</html>
